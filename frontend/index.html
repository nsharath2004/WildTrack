      --secondary: #2d6a4f;

      --dark: #0d1f17;
      --sidebar-bg: #0d2b1a;
      --card-bg: #ffffff;

    .sidebar {

      width: 260px;
      height: 100vh;

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const API = 'http://localhost:5000/api';

// ── Toast Context ─────────────────────────────────────────────────────────────
function useToast() {
  const [toasts, setToasts] = useState([]);
  const addToast = useCallback((msg, type = 'success') => {
    const id = Date.now();
    setToasts(prev => [...prev, { id, msg, type }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
  }, []);
  return { toasts, addToast };
}

function ToastContainer({ toasts }) {
  return (
    <div className="toast-container-custom">
      {toasts.map(t => (
        <div key={t.id} className={`toast-custom toast-${t.type}`}>
          <i className={`fas ${t.type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}`}></i>
          {t.msg}
        </div>
      ))}
    </div>
  );
}

// ── API Helpers ───────────────────────────────────────────────────────────────
async function apiFetch(url, options = {}) {
  let res;
  try {
    res = await fetch(url, {
      headers: { 'Content-Type': 'application/json' },
      ...options
    });
  } catch (netErr) {
    throw new Error('Cannot reach Flask backend server at http://localhost:5000. Is "python app.py" running in the terminal?');
  }
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || err.message || `Server returned HTTP ${res.status}`);
  }
  return res.json();
}

// ── Status Badges ─────────────────────────────────────────────────────────────
function ConservationBadge({ status }) {
  const map = {
    'Endangered':           'badge-endangered',
    'Critically Endangered':'badge-critically',
    'Vulnerable':           'badge-vulnerable',
    'Near Threatened':      'badge-near',
    'Least Concern':        'badge-least',
    'Extinct':              'badge-extinct',
  };
  return <span className={`status-badge ${map[status] || 'badge-least'}`}>{status}</span>;
}

function HealthBadge({ status }) {
  const map = {
    'Healthy':    'badge-healthy',
    'Sick':       'badge-sick',
    'Injured':    'badge-injured',
    'Recovering': 'badge-recovering',
  };
  return <span className={`status-badge ${map[status] || 'badge-healthy'}`}>{status}</span>;
}

function SeverityBadge({ severity }) {
  const map = {
    'Critical': 'badge-critical-sev',
    'High':     'badge-high-sev',
    'Medium':   'badge-medium-sev',
    'Low':      'badge-low-sev',
  };
  return <span className={`status-badge ${map[severity] || 'badge-medium-sev'}`}>{severity}</span>;
}

function StatusBadge({ status }) {
  const map = {
    'Active':     'badge-active',
    'Inactive':   'badge-inactive',
    'Completed':  'badge-completed',
    'Ongoing':    'badge-ongoing',
    'Pending':    'badge-pending',
    'Resolved':   'badge-resolved',
    'Planning':   'badge-pending',
  };
  return <span className={`status-badge ${map[status] || 'badge-pending'}`}>{status}</span>;
}

// ── Loading Spinner ────────────────────────────────────────────────────────────
function Spinner() {
  return (
    <div className="loading-overlay">
      <div className="spinner-border" style={{color:'var(--secondary)'}} role="status"></div>
      <span style={{color:'var(--secondary)',fontWeight:500}}>Loading data…</span>
    </div>
  );
}

// ── Error Alert ────────────────────────────────────────────────────────────────
function ErrorAlert({ msg }) {
  return (
    <div className="alert alert-danger m-3" role="alert">
      <i className="fas fa-exclamation-circle me-2"></i>
      {msg || 'Failed to load data. Make sure the backend is running.'}
    </div>
  );
}

// ── Page Header ────────────────────────────────────────────────────────────────
function BackendIndicator() {
  const [online, setOnline] = useState(null);

  useEffect(() => {
    let active = true;
    const check = () => {
      fetch(`${API}/health`)
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(() => { if (active) setOnline(true); })
        .catch(() => { if (active) setOnline(false); });
    };
    check();
    const timer = setInterval(check, 8000);
    return () => { active = false; clearInterval(timer); };
  }, []);

  if (online === null) {
    return (
      <span style={{fontSize:12,color:'#6c757d'}}>
        <i className="fas fa-spinner fa-spin me-1 text-warning" style={{fontSize:10}}></i>
        Connecting to API...
      </span>
    );
  }

  if (online) {
    return (
      <span style={{fontSize:12,color:'#2d6a4f',fontWeight:500}}>
        <i className="fas fa-circle me-1" style={{color:'#52b788',fontSize:9}}></i>
        Backend Online
      </span>
    );
  }

  return (
    <span style={{fontSize:12,color:'#d62828',fontWeight:500}} title="Make sure 'python app.py' is running in the backend folder">
      <i className="fas fa-circle me-1" style={{color:'#d62828',fontSize:9}}></i>
      Backend Offline
    </span>
  );
}

function PageHeader({ title, subtitle, icon }) {
  return (
    <div className="top-header">
      <div>
        <h1 className="page-title">
          <i className={`fas ${icon} me-2`} style={{color:'var(--secondary)'}}></i>
          {title}
        </h1>
        {subtitle && <p className="breadcrumb-sub">{subtitle}</p>}
      </div>
      <div className="d-flex align-items-center gap-3">
        <BackendIndicator />
        <div className="header-avatar" title="WildTrack Administrator">W</div>
      </div>
    </div>
  );
}

// ── Modal Wrapper ──────────────────────────────────────────────────────────────
function ModalForm({ show, title, onClose, onSubmit, children, submitting }) {
  if (!show) return null;
  return (
    <div className="modal show d-block" tabIndex="-1" style={{background:'rgba(0,0,0,0.5)'}}>
      <div className="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div className="modal-content">
          <div className="modal-header modal-header-wildlife">
            <h5 className="modal-title"><i className="fas fa-edit me-2"></i>{title}</h5>
            <button type="button" className="btn-close" onClick={onClose}></button>
          </div>
          <div className="modal-body">
            <form onSubmit={onSubmit}>
              <div className="row g-3">{children}</div>
              <div className="d-flex justify-content-end gap-2 mt-4">
                <button type="button" className="btn btn-outline-secondary" onClick={onClose}>Cancel</button>
                <button type="submit" className="btn-wildlife" disabled={submitting}>
                  {submitting ? <><span className="spinner-border spinner-border-sm me-2"></span>Saving…</> : <><i className="fas fa-save me-2"></i>Save</>}
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Action Buttons ─────────────────────────────────────────────────────────────
function ActionBtns({ onEdit, onDelete }) {
  return (
    <div className="d-flex gap-1">
      <button className="btn-sm-icon" style={{background:'#e8f0ff',color:'#3b5bdb'}} onClick={onEdit} title="Edit">
        <i className="fas fa-pen"></i>
      </button>
      <button className="btn-sm-icon" style={{background:'#fde8e8',color:'#d62828'}} onClick={onDelete} title="Delete">
        <i className="fas fa-trash"></i>
      </button>
    </div>
  );
}

// ── FormField helpers ──────────────────────────────────────────────────────────
function FField({ label, children, col = 6 }) {
  return (
    <div className={`col-md-${col}`}>
      <label className="form-label">{label}</label>
      {children}
    </div>
  );
}

function Dashboard({ addToast }) {
  const [stats, setStats]     = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError]     = useState('');
  const [isDemo, setIsDemo]   = useState(false);
  const barRef = useRef(null);
  const pieRef = useRef(null);
  const barChart = useRef(null);
  const pieChart = useRef(null);

  const loadData = () => {
    setLoading(true);
    setError('');
    Promise.all([
      apiFetch(`${API}/dashboard/stats`),
      apiFetch(`${API}/dashboard/population-chart`),
      apiFetch(`${API}/dashboard/species-distribution`),
      apiFetch(`${API}/dashboard/recent-sightings`),
      apiFetch(`${API}/dashboard/recent-threats`),
    ])
    .then(([s, pop, dist, sightings, threats]) => {
      setStats({ s, pop, dist, sightings, threats });
      setIsDemo(false);
      setLoading(false);
    })
    .catch(e => {
      setError(e.message || 'Failed to connect to backend');
      setLoading(false);
    });
  };

  useEffect(() => {
    loadData();
  }, []);

  const loadDemoData = () => {
    setStats(DEMO_PREVIEW_DATA);
    setIsDemo(true);
    setError('');
    setLoading(false);
    if (addToast) addToast('Sample demonstration data loaded successfully!', 'info');
  };

  useEffect(() => {
    if (!stats) return;
    // Bar chart
    if (barRef.current) {
      if (barChart.current) barChart.current.destroy();
      barChart.current = new Chart(barRef.current, {
        type: 'bar',
        data: {
          labels: stats.pop.map(d => d.species_name || d.label),
          datasets: [{
            label: 'Population Count',
            data: stats.pop.map(d => (d.animal_count !== undefined ? d.animal_count : (d.count || d.value || 0))),
            backgroundColor: ['#1a4d2e','#2d6a4f','#52b788','#74c69d','#95d5b2','#b7e4c7','#40916c','#1b4332'],
            borderRadius: 6,
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }
    // Pie chart
    if (pieRef.current) {
      if (pieChart.current) pieChart.current.destroy();
      pieChart.current = new Chart(pieRef.current, {
        type: 'pie',
        data: {
          labels: stats.dist.map(d => d.conservation_status || d.label),
          datasets: [{
            data: stats.dist.map(d => d.count || d.value || 0),
            backgroundColor: ['#d62828','#8b0000','#f77f00','#f4d35e','#52b788','#2a2a2a','#3b5bdb'],
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'right' } }
        }
      });
    }
    return () => {
      if (barChart.current) barChart.current.destroy();
      if (pieChart.current) pieChart.current.destroy();
    };
  }, [stats]);

  if (loading) return <Spinner />;

  if (error && !stats) {
    return (
      <div className="page-content">
        <div className="card shadow-sm border-danger mb-4" style={{borderRadius: 12}}>
          <div className="card-body p-4">
            <div className="d-flex align-items-center mb-3">
              <div className="rounded-circle bg-danger text-white p-3 me-3 d-flex align-items-center justify-content-center" style={{width: 50, height: 50}}>
                <i className="fas fa-exclamation-triangle fa-lg"></i>
              </div>
              <div>
                <h5 className="text-danger fw-bold mb-1">Backend / Database Connection Error</h5>
                <p className="text-muted small mb-0">The frontend could not fetch live statistics from the MySQL database.</p>
              </div>
            </div>
            <div className="alert alert-secondary py-2 px-3 small font-monospace mb-3" style={{background: '#f8f9fa'}}>
              <strong>Error Details:</strong> {error}
            </div>
            <div className="p-3 bg-light rounded mb-3 small">
              <strong>Quick Checklist to Fix:</strong>
              <ol className="mb-0 mt-2 ps-3">
                <li>Make sure the Flask backend is running in your terminal: <code>python app.py</code> in <code>wildlife-management/backend</code>.</li>
                <li>Verify your MySQL password in <code>wildlife-management/backend/.env</code> matches your MySQL server password.</li>
                <li>Ensure the database <code>wildlife_management</code> is created and populated using <code>database/schema.sql</code> and <code>database/sample_data.sql</code>.</li>
              </ol>
            </div>
            <div className="d-flex gap-2">
              <button className="btn btn-outline-success" onClick={loadData}>
                <i className="fas fa-sync-alt me-1"></i> Retry Live Connection
              </button>
              <button className="btn btn-success" onClick={loadDemoData}>
                <i className="fas fa-eye me-1"></i> Preview Sample Data (Offline Demo)
              </button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  const s = stats.s;
  const statCards = [
    { label: 'Total Animals',       value: s.total_animals   || 0, icon: 'fa-paw',               bg: '#1a4d2e' },
    { label: 'Total Species',       value: s.total_species   || 0, icon: 'fa-dragon',             bg: '#2d6a4f' },
    { label: 'Protected Areas',     value: s.protected_areas || 0, icon: 'fa-tree',               bg: '#1565c0' },
    { label: 'Wildlife Sightings',  value: s.total_sightings || 0, icon: 'fa-binoculars',         bg: '#e65100' },
    { label: 'Endangered Species',  value: s.endangered_species || 0, icon: 'fa-exclamation',    bg: '#c62828' },
    { label: 'Active Projects',     value: s.active_projects || 0, icon: 'fa-seedling',           bg: '#6a1b9a' },
    { label: 'Total Researchers',   value: s.total_researchers || 0, icon: 'fa-microscope',      bg: '#283593' },
    { label: 'Total Volunteers',    value: s.total_volunteers || 0, icon: 'fa-hands-helping',    bg: '#00838f' },
  ];

  return (
    <div className="page-content">
      {isDemo && (
        <div className="alert alert-info py-2 px-3 small d-flex justify-content-between align-items-center mb-3" style={{borderRadius: 8}}>
          <span><i className="fas fa-info-circle me-1"></i> <strong>Offline Demonstration Mode:</strong> Displaying realistic sample wildlife data. Start Flask and connect MySQL to view live database records.</span>
          <button className="btn btn-sm btn-outline-primary py-0" onClick={loadData}>
            <i className="fas fa-sync-alt me-1"></i> Connect Live DB
          </button>
        </div>
      )}
      {/* Stat Cards */}
      <div className="row g-3 mb-4">
        {statCards.map((c, i) => (
          <div key={i} className="col-md-3 col-sm-6">
            <div className="stat-card">
              <div className="stat-icon" style={{background: c.bg}}>
                <i className={`fas ${c.icon}`}></i>
              </div>
              <div>
                <div className="stat-value">{c.value}</div>
                <div className="stat-label">{c.label}</div>
              </div>
            </div>
          </div>
        ))}
      </div>

      {/* Charts */}
      <div className="row g-3 mb-4">
        <div className="col-md-7">
          <div className="chart-card">
            <h6><i className="fas fa-chart-bar me-2" style={{color:'var(--secondary)'}}></i>Wildlife Population by Species</h6>
            <canvas ref={barRef} height="160"></canvas>
          </div>
        </div>
        <div className="col-md-5">
          <div className="chart-card">
            <h6><i className="fas fa-chart-pie me-2" style={{color:'var(--secondary)'}}></i>Conservation Status Distribution</h6>
            <canvas ref={pieRef} height="160"></canvas>
          </div>
        </div>
      </div>

      {/* Recent Tables */}
      <div className="row g-3">
        <div className="col-md-6">
          <div className="data-table">
            <div className="data-table-header">
              <h6><i className="fas fa-binoculars me-2" style={{color:'var(--secondary)'}}></i>Recent Sightings</h6>
            </div>
            <table className="table table-hover mb-0">
              <thead><tr><th>Animal</th><th>Area</th><th>Date</th><th>Observer</th></tr></thead>
              <tbody>
                {stats.sightings.length === 0 && <tr><td colSpan="4" className="text-center text-muted py-3">No sightings yet</td></tr>}
                {stats.sightings.map((r, i) => (
                  <tr key={i}>
                    <td>{r.animal_name}</td>
                    <td>{r.area_name}</td>
                    <td>{r.sighting_date ? new Date(r.sighting_date).toLocaleDateString() : '—'}</td>
                    <td>{r.observed_by}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
        <div className="col-md-6">
          <div className="data-table">
            <div className="data-table-header">
              <h6><i className="fas fa-exclamation-triangle me-2" style={{color:'#f77f00'}}></i>Recent Threats</h6>
            </div>
            <table className="table table-hover mb-0">
              <thead><tr><th>Type</th><th>Severity</th><th>Location</th><th>Status</th></tr></thead>
              <tbody>
                {stats.threats.length === 0 && <tr><td colSpan="4" className="text-center text-muted py-3">No threats recorded</td></tr>}
                {stats.threats.map((r, i) => (
                  <tr key={i}>
                    <td>{r.threat_type}</td>
                    <td><SeverityBadge severity={r.severity} /></td>
                    <td>{r.location}</td>
                    <td><StatusBadge status={r.status} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

// SPECIES PAGE
// ═══════════════════════════════════════════════════════════════════════════════
const EMPTY_SPECIES = { common_name:'', scientific_name:'', category:'', conservation_status:'Least Concern', description:'' };
function SpeciesPage({ addToast }) {
  const [data, setData]       = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError]     = useState('');
  const [showModal, setShowModal] = useState(false);
  const [editItem, setEditItem]   = useState(null);
  const [form, setForm]           = useState(EMPTY_SPECIES);
  const [submitting, setSubmitting] = useState(false);

  const load = () => {
    setLoading(true);
    apiFetch(`${API}/species`)
      .then(d => { setData(d); setLoading(false); })
      .catch(e => { setError(e.message); setLoading(false); });
  };
  useEffect(load, []);

  const openAdd  = () => { setForm(EMPTY_SPECIES); setEditItem(null); setShowModal(true); };
  const openEdit = r  => { setForm({...r}); setEditItem(r); setShowModal(true); };
  const closeModal = () => setShowModal(false);

  const handleSubmit = async e => {
    e.preventDefault(); setSubmitting(true);
    try {
      if (editItem) {
        await apiFetch(`${API}/species/${editItem.species_id}`, { method:'PUT', body: JSON.stringify(form) });
        addToast('Species updated successfully!');
      } else {
        await apiFetch(`${API}/species`, { method:'POST', body: JSON.stringify(form) });
        addToast('Species added successfully!');
      }
      closeModal(); load();
    } catch(err) { addToast(err.message, 'error'); }
    setSubmitting(false);
  };

  const handleDelete = async r => {
    if (!window.confirm(`Delete "${r.common_name}"?`)) return;
    try {
      await apiFetch(`${API}/species/${r.species_id}`, { method:'DELETE' });
      addToast('Species deleted.'); load();
    } catch(err) { addToast(err.message, 'error'); }
  };

  const cats = ['Mammal','Bird','Reptile','Amphibian','Fish','Insect','Plant','Other'];
  const statuses = ['Least Concern','Near Threatened','Vulnerable','Endangered','Critically Endangered','Extinct'];

  return (
    <>
      <PageHeader title="Species" subtitle="Manage wildlife species records" icon="fa-dragon" />
      <div className="page-content">
        <div className="data-table">
          <div className="data-table-header">
            <h6>All Species ({data.length})</h6>
            <button className="btn-wildlife" onClick={openAdd}><i className="fas fa-plus me-2"></i>Add Species</button>
          </div>
          {loading ? <Spinner /> : error ? <ErrorAlert msg={error} /> : (
            <table className="table table-hover mb-0">
              <thead><tr><th>#</th><th>Common Name</th><th>Scientific Name</th><th>Category</th><th>Conservation Status</th><th>Animals</th><th>Actions</th></tr></thead>
              <tbody>
                {data.length === 0 && <tr><td colSpan="7" className="text-center text-muted py-4">No species found</td></tr>}
                {data.map((r, i) => (
                  <tr key={r.species_id}>
                    <td className="text-muted">{i+1}</td>
                    <td style={{fontWeight:600}}>{r.common_name}</td>
                    <td><em style={{color:'#555'}}>{r.scientific_name}</em></td>
                    <td>{r.category}</td>
                    <td><ConservationBadge status={r.conservation_status} /></td>
                    <td><span className="fw-bold">{r.animal_count || 0}</span></td>
                    <td><ActionBtns onEdit={() => openEdit(r)} onDelete={() => handleDelete(r)} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>

      <ModalForm show={showModal} title={editItem ? 'Edit Species' : 'Add New Species'} onClose={closeModal} onSubmit={handleSubmit} submitting={submitting}>
        <FField label="Common Name *" col={6}><input className="form-control" required value={form.common_name} onChange={e => setForm({...form, common_name: e.target.value})} /></FField>
        <FField label="Scientific Name *" col={6}><input className="form-control" required value={form.scientific_name} onChange={e => setForm({...form, scientific_name: e.target.value})} /></FField>
        <FField label="Category" col={6}>
          <select className="form-select" value={form.category} onChange={e => setForm({...form, category: e.target.value})}>
            <option value="">Select category</option>
            {cats.map(c => <option key={c}>{c}</option>)}
          </select>
        </FField>
        <FField label="Conservation Status" col={6}>
          <select className="form-select" value={form.conservation_status} onChange={e => setForm({...form, conservation_status: e.target.value})}>
            {statuses.map(s => <option key={s}>{s}</option>)}
          </select>
        </FField>
        <FField label="Description" col={12}><textarea className="form-control" rows={3} value={form.description || ''} onChange={e => setForm({...form, description: e.target.value})}></textarea></FField>
      </ModalForm>
    </>
  );
}

// ANIMALS PAGE
// ═══════════════════════════════════════════════════════════════════════════════
const EMPTY_ANIMAL = { animal_name:'', species_id:'', age:'', gender:'Male', health_status:'Healthy', area_id:'', tag_number:'', notes:'' };
function AnimalsPage({ addToast }) {
  const [data, setData]       = useState([]);
  const [species, setSpecies] = useState([]);
  const [areas, setAreas]     = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError]     = useState('');
  const [showModal, setShowModal] = useState(false);
  const [editItem, setEditItem]   = useState(null);
  const [form, setForm]           = useState(EMPTY_ANIMAL);
  const [submitting, setSubmitting] = useState(false);
  const [search, setSearch]   = useState('');

  const load = () => {
    setLoading(true);
    Promise.all([apiFetch(`${API}/animals`), apiFetch(`${API}/species`), apiFetch(`${API}/areas`)])
      .then(([a, sp, ar]) => { setData(a); setSpecies(sp); setAreas(ar); setLoading(false); })
      .catch(e => { setError(e.message); setLoading(false); });
  };
  useEffect(load, []);

  const filtered = data.filter(r =>
    (r.animal_name || '').toLowerCase().includes(search.toLowerCase()) ||
    (r.tag_number  || '').toLowerCase().includes(search.toLowerCase())
  );

  const openAdd  = () => { setForm(EMPTY_ANIMAL); setEditItem(null); setShowModal(true); };
  const openEdit = r  => { setForm({...r, species_id: r.species_id||'', area_id: r.area_id||''}); setEditItem(r); setShowModal(true); };
  const closeModal = () => setShowModal(false);

  const handleSubmit = async e => {
    e.preventDefault(); setSubmitting(true);
    try {
      if (editItem) {
        await apiFetch(`${API}/animals/${editItem.animal_id}`, { method:'PUT', body: JSON.stringify(form) });
        addToast('Animal updated!');
      } else {
        await apiFetch(`${API}/animals`, { method:'POST', body: JSON.stringify(form) });
        addToast('Animal added!');
      }
      closeModal(); load();
    } catch(err) { addToast(err.message, 'error'); }
    setSubmitting(false);
  };

  const handleDelete = async r => {
    if (!window.confirm(`Delete "${r.animal_name}"?`)) return;
    try {
      await apiFetch(`${API}/animals/${r.animal_id}`, { method:'DELETE' });
      addToast('Animal deleted.'); load();
    } catch(err) { addToast(err.message, 'error'); }
  };

  return (
    <>
      <PageHeader title="Animals" subtitle="Manage individual animal records" icon="fa-paw" />
      <div className="page-content">
        <div className="data-table">
          <div className="data-table-header">
            <h6>All Animals ({filtered.length})</h6>
            <div className="d-flex gap-2 align-items-center">
              <div className="search-box">
                <i className="fas fa-search"></i>
                <input className="form-control form-control-sm" placeholder="Search name or tag…" value={search} onChange={e => setSearch(e.target.value)} />
              </div>
              <button className="btn-wildlife" onClick={openAdd}><i className="fas fa-plus me-2"></i>Add Animal</button>
            </div>
          </div>
          {loading ? <Spinner /> : error ? <ErrorAlert msg={error} /> : (
            <table className="table table-hover mb-0">
              <thead><tr><th>#</th><th>Name</th><th>Species</th><th>Area</th><th>Age</th><th>Gender</th><th>Health</th><th>Tag #</th><th>Actions</th></tr></thead>
              <tbody>
                {filtered.length === 0 && <tr><td colSpan="9" className="text-center text-muted py-4">No animals found</td></tr>}
                {filtered.map((r, i) => (
                  <tr key={r.animal_id}>
                    <td className="text-muted">{i+1}</td>
                    <td style={{fontWeight:600}}>{r.animal_name}</td>
                    <td>{r.species_name}</td>
                    <td>{r.area_name || '—'}</td>
                    <td>{r.age != null ? r.age + ' yr' : '—'}</td>
                    <td>{r.gender}</td>
                    <td><HealthBadge status={r.health_status} /></td>
                    <td><code style={{fontSize:11}}>{r.tag_number}</code></td>
                    <td><ActionBtns onEdit={() => openEdit(r)} onDelete={() => handleDelete(r)} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>

      <ModalForm show={showModal} title={editItem ? 'Edit Animal' : 'Add New Animal'} onClose={closeModal} onSubmit={handleSubmit} submitting={submitting}>
        <FField label="Animal Name *" col={6}><input className="form-control" required value={form.animal_name} onChange={e => setForm({...form, animal_name: e.target.value})} /></FField>
        <FField label="Tag Number" col={6}><input className="form-control" value={form.tag_number||''} onChange={e => setForm({...form, tag_number: e.target.value})} /></FField>
        <FField label="Species *" col={6}>
          <select className="form-select" required value={form.species_id} onChange={e => setForm({...form, species_id: e.target.value})}>
            <option value="">Select species…</option>
            {species.map(s => <option key={s.species_id} value={s.species_id}>{s.common_name}</option>)}
          </select>
        </FField>
        <FField label="Protected Area" col={6}>
          <select className="form-select" value={form.area_id||''} onChange={e => setForm({...form, area_id: e.target.value})}>
            <option value="">No area assigned</option>
            {areas.map(a => <option key={a.area_id} value={a.area_id}>{a.area_name}</option>)}
          </select>
        </FField>
        <FField label="Age (years)" col={4}><input type="number" className="form-control" value={form.age||''} onChange={e => setForm({...form, age: e.target.value})} /></FField>
        <FField label="Gender" col={4}>
          <select className="form-select" value={form.gender||'Male'} onChange={e => setForm({...form, gender: e.target.value})}>
            {['Male','Female','Unknown'].map(g => <option key={g}>{g}</option>)}
          </select>
        </FField>
        <FField label="Health Status" col={4}>
          <select className="form-select" value={form.health_status||'Healthy'} onChange={e => setForm({...form, health_status: e.target.value})}>
            {['Healthy','Sick','Injured','Recovering'].map(h => <option key={h}>{h}</option>)}
          </select>
        </FField>
        <FField label="Notes" col={12}><textarea className="form-control" rows={2} value={form.notes||''} onChange={e => setForm({...form, notes: e.target.value})}></textarea></FField>
      </ModalForm>
    </>
  );
}

// ═══════════════════════════════════════════════════════════════════════════════
// DBMS CONCEPTS PAGE
// ═══════════════════════════════════════════════════════════════════════════════
function DBMSConceptsPage() {
  const concepts = [
    {
      tag: 'DDL', name: 'CREATE / INSERT / UPDATE / DELETE',
      desc: 'Data Definition Language and Data Manipulation Language operations form the backbone of the database.',
      code: `CREATE TABLE Species (
  species_id INT PRIMARY KEY AUTO_INCREMENT,
  common_name VARCHAR(100) NOT NULL,
  scientific_name VARCHAR(150),
  conservation_status ENUM('Least Concern','Vulnerable',
    'Endangered','Critically Endangered','Extinct')
);

INSERT INTO Species (common_name, scientific_name)
VALUES ('Bengal Tiger', 'Panthera tigris tigris');

UPDATE Species SET conservation_status = 'Endangered'
WHERE species_id = 1;

DELETE FROM Species WHERE species_id = 5;`
    },
    {
      tag: 'DQL', name: 'SELECT with Filtering',
      desc: 'Querying data with WHERE, ORDER BY, LIMIT to retrieve specific wildlife records.',
      code: `-- Find endangered animals sorted by name
SELECT a.animal_name, s.common_name, a.health_status
FROM Animals a
JOIN Species s ON a.species_id = s.species_id
WHERE s.conservation_status = 'Endangered'
ORDER BY a.animal_name ASC
LIMIT 10;`
    },
    {
      tag: 'GROUP BY', name: 'GROUP BY & Aggregate Functions',
      desc: 'Grouping and aggregating data to produce summary statistics used in the dashboard.',
      code: `-- Population count by conservation status
SELECT s.conservation_status,
       COUNT(a.animal_id) AS animal_count,
       AVG(a.age)         AS avg_age,
       MAX(a.age)         AS oldest
FROM Animals a
JOIN Species s USING (species_id)
GROUP BY s.conservation_status
ORDER BY animal_count DESC;`
    },
    {
      tag: 'INNER JOIN', name: 'INNER JOIN',
      desc: 'Combining rows from multiple tables where the join condition is satisfied.',
      code: `-- Sightings with animal, species and area details
SELECT a.animal_name, s.common_name AS species,
       pa.area_name, si.sighting_date, si.observed_by
FROM Sightings si
INNER JOIN Animals  a  ON si.animal_id = a.animal_id
INNER JOIN Species  s  ON a.species_id  = s.species_id
INNER JOIN ProtectedAreas pa ON si.area_id = pa.area_id
ORDER BY si.sighting_date DESC;`
    },
    {
      tag: 'LEFT JOIN', name: 'LEFT JOIN',
      desc: 'Retrieving all rows from the left table even when no match exists in the right table.',
      code: `-- All animals, with or without a sighting
SELECT a.animal_name,
       COUNT(s.sighting_id) AS total_sightings,
       MAX(s.sighting_date) AS last_seen
FROM Animals a
LEFT JOIN Sightings s ON a.animal_id = s.animal_id
GROUP BY a.animal_id, a.animal_name
ORDER BY total_sightings DESC;`
    },
    {
      tag: 'SUBQUERY', name: 'Subqueries',
      desc: 'Nested SELECT statements used for filtering and derived data sets.',
      code: `-- Animals in areas larger than average size
SELECT animal_name, tag_number
FROM Animals
WHERE area_id IN (
  SELECT area_id FROM ProtectedAreas
  WHERE area_size_km2 > (
    SELECT AVG(area_size_km2) FROM ProtectedAreas
  )
);`
    },
    {
      tag: 'VIEW', name: 'Views',
      desc: 'Virtual tables created from stored SELECT queries for simplified data access.',
      code: `CREATE VIEW EndangeredAnimalsView AS
SELECT a.animal_id, a.animal_name, a.health_status,
       s.common_name, s.conservation_status,
       pa.area_name
FROM Animals a
JOIN Species        s  USING (species_id)
LEFT JOIN ProtectedAreas pa USING (area_id)
WHERE s.conservation_status IN
      ('Endangered', 'Critically Endangered');

-- Usage:
SELECT * FROM EndangeredAnimalsView
WHERE health_status != 'Healthy';`
    },
    {
      tag: 'STORED PROC', name: 'Stored Procedures',
      desc: 'Pre-compiled SQL routines stored in the database for reusable complex logic.',
      code: `DELIMITER //
CREATE PROCEDURE GetAreaStats(IN p_area_id INT)
BEGIN
  SELECT pa.area_name,
         COUNT(DISTINCT a.animal_id) AS animals,
         COUNT(DISTINCT si.sighting_id) AS sightings,
         COUNT(DISTINCT v.volunteer_id) AS volunteers
  FROM ProtectedAreas pa
  LEFT JOIN Animals   a  ON a.area_id  = pa.area_id
  LEFT JOIN Sightings si ON si.area_id = pa.area_id
  LEFT JOIN Volunteers v ON v.area_id  = pa.area_id
  WHERE pa.area_id = p_area_id
  GROUP BY pa.area_name;
END //
DELIMITER ;

CALL GetAreaStats(1);`
    },
    {
      tag: 'TRIGGER', name: 'Triggers',
      desc: 'Automatic actions that fire in response to INSERT, UPDATE, or DELETE events.',
      code: `DELIMITER //
CREATE TRIGGER after_sighting_insert
AFTER INSERT ON Sightings
FOR EACH ROW
BEGIN
  -- Log sighting count update
  UPDATE Animals
  SET last_sighted = NEW.sighting_date
  WHERE animal_id = NEW.animal_id;

  INSERT INTO AuditLog (table_name, action, record_id, changed_at)
  VALUES ('Sightings', 'INSERT', NEW.sighting_id, NOW());
END //
DELIMITER ;`
    },
    {
      tag: 'TRANSACTION', name: 'Transactions',
      desc: 'Atomic units of work ensuring data consistency with COMMIT and ROLLBACK.',
      code: `START TRANSACTION;

-- Transfer animal between areas
UPDATE Animals
  SET area_id = 3
  WHERE animal_id = 7;

INSERT INTO Sightings
  (animal_id, area_id, sighting_date, observed_by)
VALUES (7, 3, CURDATE(), 'Transfer Team');

-- Confirm all steps succeeded
COMMIT;

-- If any error occurs, roll back:
-- ROLLBACK;`
    },
    {
      tag: 'KEYS', name: 'Primary & Foreign Keys',
      desc: 'Constraints that enforce referential integrity across related tables.',
      code: `-- Primary key auto-increments each table's ID
-- Foreign keys ensure relational integrity

CREATE TABLE Animals (
  animal_id  INT PRIMARY KEY AUTO_INCREMENT,
  animal_name VARCHAR(100) NOT NULL,
  species_id INT NOT NULL,
  area_id    INT,
  FOREIGN KEY (species_id)
    REFERENCES Species(species_id)
    ON DELETE RESTRICT,
  FOREIGN KEY (area_id)
    REFERENCES ProtectedAreas(area_id)
    ON DELETE SET NULL
);`
    },
    {
      tag: 'INDEX', name: 'Indexes & Performance',
      desc: 'Indexes speed up data retrieval on frequently queried columns.',
      code: `-- Speed up species lookup by name
CREATE INDEX idx_species_name
  ON Species(common_name);

-- Composite index for sighting queries
CREATE INDEX idx_sighting_date_animal
  ON Sightings(sighting_date, animal_id);

-- Check index usage with EXPLAIN
EXPLAIN SELECT * FROM Sightings
WHERE sighting_date >= '2024-01-01';`
    },
  ];

  return (
    <>
      <PageHeader title="DBMS Concepts" subtitle="SQL concepts demonstrated in this project" icon="fa-database" />
      <div className="page-content">
        <div className="alert" style={{background:'#e8f7ee',border:'1px solid #74c69d',borderRadius:10,color:'#1a4d2e'}} role="alert">
          <i className="fas fa-info-circle me-2"></i>
          <strong>DBMS Concepts Demonstrated in This Project</strong> — All 12 concepts below are actively used in the WildTrack backend database (MySQL).
        </div>
        <div className="row g-3">
          {concepts.map((c, i) => (
            <div key={i} className="col-md-6">
              <div className="concept-card">
                <span className="concept-tag">{c.tag}</span>
                <h6 style={{fontWeight:700, color:'var(--text-dark)', marginBottom:6}}>{c.name}</h6>
                <p style={{fontSize:13, color:'#555', marginBottom:0}}>{c.desc}</p>
                <pre><code>{c.code}</code></pre>
              </div>
            </div>
          ))}
        </div>
      </div>
    </>
  );
}
